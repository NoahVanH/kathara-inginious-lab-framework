frr version 8.4
frr defaults traditional
hostname as3
service integrated-vtysh-config
!
interface lo
!
interface eth0
!
interface eth1
!

router bgp 3
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
! BGP Roles (RFC 9234)
 neighbor 2001:db8:33bc::1 remote-as 1
 neighbor 2001:db8:33bc::1 local-role customer strict-mode
 neighbor 2001:db8:37fb::2 remote-as 4
 neighbor 2001:db8:37fb::2 local-role peer strict-mode
!
address-family ipv6 unicast
 network 2001:db8:1::3/128
 neighbor 2001:db8:33bc::1 activate
 neighbor 2001:db8:33bc::1 route-map LP_as1 in
 neighbor 2001:db8:37fb::2 activate
 neighbor 2001:db8:37fb::2 route-map LP_as4 in
exit-address-family
!
route-map LP_as1 permit 10
 set local-preference 50
!
route-map LP_as4 permit 10
 set local-preference 100
!
line vty
