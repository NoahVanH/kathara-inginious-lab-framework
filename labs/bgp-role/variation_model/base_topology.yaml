
nodes:
  as1:
    image: kathara/frr
    interfaces:
      lo:
        subnet: as1_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 1
      eth1:
        link: B
        subnet: B_net
        host_offset: 1
      eth2:
        link: C
        subnet: C_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  as2:
    image: kathara/frr
    interfaces:
