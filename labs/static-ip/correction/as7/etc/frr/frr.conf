frr version 8.4
frr defaults traditional
hostname as7
service integrated-vtysh-config
!
interface lo
!
interface eth0
!

router bgp 7
 bgp router-id 7.7.7.7
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
! BGP Roles (RFC 9234)
 neighbor 2001:db8:650d::1 remote-as 4
 neighbor 2001:db8:650d::1 local-role customer strict-mode
!
address-family ipv6 unicast
 network 2001:db8:1::7/128
 neighbor 2001:db8:650d::1 activate
 neighbor 2001:db8:650d::1 route-map LP_as4 in
exit-address-family
!
route-map LP_as4 permit 10
 set local-preference 50
!
line vty
