lab:
  name: fastreroute_tilfa_lab

  ipv6: true

nodes:
  r1:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: r1_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 1
      eth1:
        link: D
        subnet: D_net
        host_offset: 1
      eth2:
        link: C
        subnet: C_net
        host_offset: 1
    daemons: [zebra, isisd]
    sysctl:
      net.ipv6.conf.all.forwarding: 1
      net.mpls.platform_labels: 100000

  r2:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: r2_lo
