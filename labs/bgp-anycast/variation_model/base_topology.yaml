
nodes:
  as1_r1:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: as1_r1_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 1
      eth1:
        link: B
        subnet: B_net
        host_offset: 1
      eth2:
        link: F
        subnet: F_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  as2_r2:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: as2_r2_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 2
      eth1:
        link: C
        subnet: C_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  as3_r3:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: as3_r3_lo
      eth0:
        link: B
        subnet: B_net
        host_offset: 2
      eth1:
        link: E
        subnet: E_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  as4_r4:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: as4_r4_lo
      eth0:
        link: E
        subnet: E_net
        host_offset: 2
      eth1:
        link: D
        subnet: D_net
        host_offset: 1

    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  as100_ns1:
    image: noahvanh1315/frr-bind9
    interfaces:
      lo:
        subnet: anycast_net
      eth0:
        link: C
        subnet: C_net
        host_offset: 2
      anycast:
        subnet: anycast_net

    daemons: [zebra, bgpd]
    
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1
    default_route:
      via_node: as2_r2
      via_interface: eth1

  as200_ns2:
    image: noahvanh1315/frr-bind9
    interfaces:
      lo:
        subnet: anycast_net
      eth0:
        link: D
        subnet: D_net
        host_offset: 2
      anycast:
        subnet: anycast_net
    daemons: [zebra, bgpd, bind]
    
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1
    default_route:
      via_node: as4_r4
      via_interface: eth1
  client:
    image: kathara/frr:latest
    interfaces:
      lo:
        subnet: client_lo
      eth0:
        link: F
        subnet: F_net
        host_offset: 2
    daemons: [zebra]
    sysctl:
      net.ipv6.conf.all.forwarding: 1
    default_route:
      via_node: as1_r1
      via_interface: eth2