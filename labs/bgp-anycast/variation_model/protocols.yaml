protocols:
  as1_r1:
    template: router_bgp_only
    bgp:
      local_as: 1
      router_id: 1.1.1.1
      network_interfaces: [lo,eth2]

      ebgp_neighbors:
        - local_interface: eth0
          neighbor_node: as2_r2
          neighbor_interface: eth0
          remote_as: 2
          relationship: customer
          local_preference: 50

        - local_interface: eth1
          neighbor_node: as3_r3
          neighbor_interface: eth0
          remote_as: 3
          relationship: customer
          local_preference: 50

      ibgp_neighbors: []

  as2_r2:
    template: router_bgp_only
    bgp:
      local_as: 2
      router_id: 2.2.2.2
      network_interfaces: [lo]

      ebgp_neighbors:
        - local_interface: eth0
          neighbor_node: as1_r1
          neighbor_interface: eth0
          remote_as: 1
          relationship: customer
          local_preference: 50

        - local_interface: eth1
          neighbor_node: as100_ns1
          neighbor_interface: eth0
          remote_as: 100
          relationship: customer
          local_preference: 50

      ibgp_neighbors: []

  as3_r3:
    template: router_bgp_only
    bgp:
      local_as: 3
      router_id: 3.3.3.3
      network_interfaces: [lo]

      ebgp_neighbors:
        - local_interface: eth0
          neighbor_node: as1_r1
          neighbor_interface: eth1
          remote_as: 1
          relationship: customer
          local_preference: 50

        - local_interface: eth1
          neighbor_node: as4_r4
          neighbor_interface: eth0
          remote_as: 4
          relationship: customer
          local_preference: 50

      ibgp_neighbors: []

  as4_r4:
    template: router_bgp_only
    bgp:
      local_as: 4
      router_id: 4.4.4.4
      network_interfaces: [lo]

      ebgp_neighbors:
        - local_interface: eth0
          neighbor_node: as3_r3
          neighbor_interface: eth1
          remote_as: 3
          relationship: customer
          local_preference: 50

        - local_interface: eth1
          neighbor_node: as200_ns2
          neighbor_interface: eth0
          remote_as: 200
          relationship: customer
          local_preference: 200

      ibgp_neighbors: []

  as100_ns1:
    template: router_bgp_only
    bgp:
      local_as: 100
      router_id: 100.100.100.100
      #network_prefixes: [anycast]
      network_interfaces: [lo]
      anycast_prefixes: anycast_net

      ebgp_neighbors:
        - local_interface: eth0
          neighbor_node: as2_r2
          neighbor_interface: eth1
          remote_as: 2
          relationship: customer
          local_preference: 50

      ibgp_neighbors: []
    dns:
      domain: lab.be
      nameserver: ns1
      type: doh
      records:
        - name: ns1
          type: AAAA
       
       

    
  as200_ns2:
    template: router_bgp_only
    bgp:
      local_as: 200
      router_id: 200.200.200.200
      network_interfaces: [lo]
      anycast_prefixes: anycast_net

   

      ebgp_neighbors:
        - local_interface: eth0
          neighbor_node: as4_r4
          neighbor_interface: eth1
          remote_as: 4
          relationship: customer
          local_preference: 50

      ibgp_neighbors: []

    dns:  
      domain: lab.be
      nameserver: ns2
      type: dot
      records:
        - name: ns2
          type: AAAA
 
        

