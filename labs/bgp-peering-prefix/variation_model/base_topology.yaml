lab:
  name: bgp_ipv6_lab
  author: Noah Van Horenbeke
  ipv6: true

nodes:
  r1:
    image: kathara/frr
    interfaces:
      lo:
        subnet: r1_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  r2:
    image: kathara/frr
    interfaces:
      lo:
        subnet: r2_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 2
      eth1:
        link: D
        subnet: D_net
        host_offset: 1
      eth2:
        link: E
        subnet: E_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  r3:
    image: kathara/frr
    interfaces:
      lo:
        subnet: r3_lo
      eth0:
        link: B
        subnet: B_net
        host_offset: 1
      eth1:
        link: D
        subnet: D_net
        host_offset: 2
      eth2:
        link: F
        subnet: F_net
        host_offset: 1
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  r4:
    image: kathara/frr
    interfaces:
      lo:
        subnet: r4_lo
      eth0:
        link: C
        subnet: C_net
        host_offset: 1
      eth1:
        link: E
        subnet: E_net
        host_offset: 2
      eth2:
        link: F
        subnet: F_net
        host_offset: 2
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  r5:
    image: kathara/frr
    interfaces:
      lo:
        subnet: r5_lo
      eth0:
        link: B
        subnet: B_net
        host_offset: 2
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1

  r6:
    image: kathara/frr
    interfaces:
      lo:
        subnet: r6_lo
      eth0:
        link: C
        subnet: C_net
        host_offset: 2
    daemons: [zebra, bgpd]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1