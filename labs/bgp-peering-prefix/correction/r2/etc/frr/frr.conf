
frr version 8.4
frr defaults traditional
hostname r2
service integrated-vtysh-config
!

interface lo
!

interface eth0
!

interface eth1
!

interface eth2
!

router bgp 1
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast


 neighbor 2001:db8:12::1 remote-as 2


 neighbor 2001:db8:1::3 remote-as 1

 neighbor 2001:db8:1::3 update-source lo


 neighbor 2001:db8:1::4 remote-as 1

 neighbor 2001:db8:1::4 update-source lo


 !
 address-family ipv6 unicast

  network 2001:db8:1::2/128



  neighbor 2001:db8:12::1 activate




  neighbor 2001:db8:1::3 activate


  neighbor 2001:db8:1::3 next-hop-self



  neighbor 2001:db8:1::4 activate


  neighbor 2001:db8:1::4 next-hop-self


 exit-address-family
!
line vty
