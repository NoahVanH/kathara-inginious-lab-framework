labs_path: ../create_lab.py
convergence_time: 15
default_image: kathara/base
structure: lab.conf

lab_inline: |
  r1[0]="A"
  r2[0]="A"
  r5[0]="B"
  r3[0]="B"
  r6[0]="C"
  r4[0]="C"
  r2[1]="D"
  r3[1]="D"
  r2[2]="E"
  r4[1]="E"
  r3[2]="F"
  r4[2]="F"

test:
  requiring_startup:
    - r1
    - r2
    - r3
    - r4
    - r5
    - r6

  ip_mapping:
    r1:
      lo: 2001:db8:1::1/128
      eth0: 2001:db8:12::1/64

    r2:
      lo: 2001:db8:1::2/128
      eth0: 2001:db8:12::2/64
      eth1: 2001:db8:23::1/64
      eth2: 2001:db8:24::1/64

    r3:
      lo: 2001:db8:1::3/128
      eth0: 2001:db8:35::1/64
      eth1: 2001:db8:23::2/64
      eth2: 2001:db8:34::1/64

    r4:
      lo: 2001:db8:1::4/128
      eth0: 2001:db8:46::1/64
      eth1: 2001:db8:24::2/64
      eth2: 2001:db8:34::2/64

    r5:
      lo: 2001:db8:1::5/128
      eth0: 2001:db8:35::2/64

    r6:
      lo: 2001:db8:1::6/128
      eth0: 2001:db8:46::2/64

  daemons:
    r1:
      - bgpd
    r2:
      - bgpd
    r3:
      - bgpd
    r4:
      - bgpd
    r5:
      - bgpd
    r6:
      - bgpd

  protocols:
    bgpd:
      networks:
        r1:
          - 2001:db8:1::1/128
        r2:
          - 2001:db8:1::2/128
        r3:
          - 2001:db8:1::3/128
        r4:
          - 2001:db8:1::4/128
        r5:
          - 2001:db8:1::5/128
        r6:
          - 2001:db8:1::6/128

  custom_commands:
    r1:
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:12::2'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:12::2\s+4\s+1(\s|$)'

    r2:
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:12::1'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:12::1\s+4\s+2(\s|$)'

      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::3'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::3\s+4\s+1(\s|$)'

      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::4'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::4\s+4\s+1(\s|$)'

    r3:
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:35::2'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:35::2\s+4\s+3(\s|$)'

      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::2'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::2\s+4\s+1(\s|$)'

      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::4'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::4\s+4\s+1(\s|$)'

    r4:
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:46::2'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:46::2\s+4\s+4(\s|$)'

      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::2'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::2\s+4\s+1(\s|$)'

      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::3'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:1::3\s+4\s+1(\s|$)'

    r5:
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:35::1'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:35::1\s+4\s+1(\s|$)'

    r6:
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:46::1'
      - command: 'vtysh -c "show bgp ipv6 summary"'
        regex_match: '2001:db8:46::1\s+4\s+1(\s|$)'
