
frr version 8.4
frr defaults traditional
hostname r3
service integrated-vtysh-config
!

interface lo
!

interface eth0
!

interface eth1
!

interface eth2
!

router bgp 1
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast


 neighbor 2001:db8:35::2 remote-as 3


 neighbor 2001:db8:1::2 remote-as 1

 neighbor 2001:db8:1::2 update-source lo


 neighbor 2001:db8:1::4 remote-as 1

 neighbor 2001:db8:1::4 update-source lo


 !
 address-family ipv6 unicast

  network 2001:db8:1::3/128



  neighbor 2001:db8:35::2 activate




  neighbor 2001:db8:1::2 activate


  neighbor 2001:db8:1::2 next-hop-self



  neighbor 2001:db8:1::4 activate


  neighbor 2001:db8:1::4 next-hop-self


 exit-address-family
!
line vty
