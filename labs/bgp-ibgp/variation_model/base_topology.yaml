lab:
  name: bgp_iBGP_ipv6_lab
  author: Noah Van Horenbeke
  ipv6: true

nodes:
  as1_r1:
    image: kathara/frr
    interfaces:
      lo:
        subnet: as1_r1_lo
      eth0:
        link: A
        subnet: A_net
        host_offset: 1
      eth1:
        link: G
        subnet: G_net
        host_offset: 1
      eth2:
        link: H
        subnet: H_net
        host_offset: 1
    daemons: [zebra, bgpd, ospf6d]
    bgp:
      advertise_loopback: true
    sysctl:
      net.ipv6.conf.all.forwarding: 1
