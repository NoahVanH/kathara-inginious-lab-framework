frr version 8.4
frr defaults traditional
hostname as1_r1
service integrated-vtysh-config
!
interface lo
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 passive
!
interface eth0
!
interface eth1
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 cost 7
!
interface eth2
 ipv6 ospf6 area 0.0.0.0
!
router ospf6
 router-id 1.1.1.1
!
router bgp 1
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:18::2 remote-as 3
 neighbor 2001:db8:1::4 remote-as 1
 neighbor 2001:db8:1::4 update-source lo
 neighbor 2001:db8:1::5 remote-as 1
 neighbor 2001:db8:1::5 update-source lo
 neighbor 2001:db8:1::6 remote-as 1
 neighbor 2001:db8:1::6 update-source lo
 !
 address-family ipv6 unicast
  network 2001:db8:1::1/128
  neighbor 2001:db8:18::2 activate
  neighbor 2001:db8:1::4 activate
  neighbor 2001:db8:1::4 next-hop-self
  neighbor 2001:db8:1::5 activate
  neighbor 2001:db8:1::5 next-hop-self
  neighbor 2001:db8:1::6 activate
  neighbor 2001:db8:1::6 next-hop-self
 exit-address-family
!

line vty
!
