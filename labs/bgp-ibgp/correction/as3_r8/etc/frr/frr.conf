
frr version 8.4
frr defaults traditional
hostname as3_r8
service integrated-vtysh-config
!
interface lo
!
interface eth0
!
interface eth1
!
router bgp 3
 bgp router-id 8.8.8.8
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:18::1 remote-as 1
 neighbor 2001:db8:89::2 remote-as 5
 !
 address-family ipv6 unicast
  network 2001:db8:1::8/128
  neighbor 2001:db8:18::1 activate
  neighbor 2001:db8:89::2 activate
 exit-address-family
!
line vty
