labs_path: ../create_lab.py
convergence_time: 15
default_image: kathara/base
structure: lab.conf
# This files containes usefull tests to check the state of the lab. 
# You are encouraged to add tests to check the state of the lab and help you debug your configuration.
# INGInious use more tests than this file.

# Advice : Check the 'custom_commands' section. The other sections are present to make sure you don't break the lab setup.

lab_inline: |
  LAB_NAME="bgp_ipv6_local_pref"

  LAB_AUTHOR="Noah Van Horenbeke"

  as1[ipv6]="true"
  as1[0]="A"
  as1[1]="B"
  as1[2]="C"
  as1[image]="kathara/frr"

  as2[ipv6]="true"
  as2[0]="A"
  as2[1]="D"
  as2[image]="kathara/frr"

  as3[ipv6]="true"
  as3[0]="B"
  as3[1]="E"
  as3[image]="kathara/frr"

  as4[ipv6]="true"
  as4[0]="C"
  as4[1]="D"
  as4[2]="E"
  as4[3]="F"
  as4[image]="kathara/frr"

  as7[ipv6]="true"
  as7[0]="F"
  as7[image]="kathara/frr"


test:

  requiring_startup:
    - as1
    - as2
    - as3
    - as4
    - as7

  # It is normal that the ping not work.
  # Reachability tests (ping) are not relevant for this lab, we will focus on BGP routes and attributes
 

  ip_mapping:
    as1:
      lo: 2001:db8:1::1/128
      eth0: 2001:db8:fdc3::1/64
      eth1: 2001:db8:33bc::1/64
      eth2: 2001:db8:70f5::1/64

    as2:
      lo: 2001:db8:1::2/128
      eth0: 2001:db8:fdc3::2/64
      eth1: 2001:db8:65d7::1/64

    as3:
      lo: 2001:db8:1::3/128
      eth0: 2001:db8:33bc::2/64
      eth1: 2001:db8:37fb::1/64

    as4:
      lo: 2001:db8:1::4/128
      eth0: 2001:db8:70f5::2/64
      eth1: 2001:db8:65d7::2/64
      eth2: 2001:db8:37fb::2/64
      eth3: 2001:db8:650d::1/64

    as7:
      lo: 2001:db8:1::7/128
      eth0: 2001:db8:650d::2/64

  daemons:
    as1: [zebra, bgpd]
    as2: [zebra, bgpd]
    as3: [zebra, bgpd]
    as4: [zebra, bgpd]
    as7: [zebra, bgpd]

  protocols:
    bgpd:
      networks:
        as1:
          - 2001:db8:1::1/128
        as2:
          - 2001:db8:1::2/128
        as3:
          - 2001:db8:1::3/128
        as4:
          - 2001:db8:1::4/128
        as7:
          - 2001:db8:1::7/128

  custom_commands:

    # =========================
    # AS4 
    # =========================
    as4:

      # EXPORT → AS3 (peer)
      - command: 'vtysh -c "show bgp neighbors 2001:db8:37fb::1 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*2'

      # EXPORT → providers
      - command: 'vtysh -c "show bgp neighbors 2001:db8:70f5::1 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*2'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:65d7::1 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*2'

      # PATH checks
      - command: 'vtysh -c "show bgp neighbors 2001:db8:37fb::1 advertised-routes json"'
        regex_match: '"network":"2001:db8:1::4/128"[^}]*"path":""'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:37fb::1 advertised-routes json"'
        regex_match: '"network":"2001:db8:1::7/128"[^}]*"path":"7"'

      # IMPORT checks
      - command: 'vtysh -c "show bgp neighbors 2001:db8:37fb::1 prefix-counts json"'
        regex_match: '"Valid":\s*1'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:70f5::1 prefix-counts json"'
        regex_match: '"Valid":\s*3'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:65d7::1 prefix-counts json"'
        regex_match: '"Valid":\s*3'

      # Local preference checks (import policy)
      # Customer (AS7) must be preferred
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::7/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*200'

      # Providers must have lower preference
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::1/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*50'

      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::2/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*50'


    # =========================
    # AS3
    # =========================
    as3:

      # EXPORT → AS4 (peer)
      - command: 'vtysh -c "show bgp neighbors 2001:db8:37fb::2 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*2'

      # IMPORT checks
      - command: 'vtysh -c "show bgp neighbors 2001:db8:33bc::1 prefix-counts json"'
        regex_match: '"Valid":\s*4'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:37fb::2 prefix-counts json"'
        regex_match: '"Valid":\s*2'

      # Local preference checks
      # Provider (AS1) must be least preferred
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::1/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*50'

      # Peer (AS4) must be medium preference
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::4/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*100'

      # Best path to AS7
      - command: 'vtysh -c "show bgp ipv6 unicast json"'
        regex_match: '"2001:db8:1::7/128".*"bestpath":true.*"nexthops":\[\{"ip":"2001:db8:37fb::2"'

    # =========================
    # AS1
    # =========================
    as1:

      # EXPORT → AS2 (peer)
      - command: 'vtysh -c "show bgp neighbors 2001:db8:fdc3::2 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*4'

      # IMPORT
      - command: 'vtysh -c "show bgp neighbors 2001:db8:fdc3::2 prefix-counts json"'
        regex_match: '"Valid":\s*3'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:33bc::2 prefix-counts json"'
        regex_match: '"Valid":\s*1'

      # Local preference checks
      # Customers (AS3, AS4) must be preferred
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::3/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*200'

      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::4/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*200'

      # Peer (AS2) must be medium preference
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::2/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*100'

      # Best path to AS7
      - command: 'vtysh -c "show bgp ipv6 unicast json"'
        regex_match: '"2001:db8:1::7/128".*"bestpath":true.*"nexthops":\[\{"ip":"2001:db8:70f5::2"'

    # =========================
    # AS2
    # =========================
    as2:

      # EXPORT → AS4 (customer)
      - command: 'vtysh -c "show bgp neighbors 2001:db8:65d7::2 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*5'

      # IMPORT
      - command: 'vtysh -c "show bgp neighbors 2001:db8:fdc3::1 prefix-counts json"'
        regex_match: '"Valid":\s*4'

      - command: 'vtysh -c "show bgp neighbors 2001:db8:65d7::2 prefix-counts json"'
        regex_match: '"Valid":\s*2'

      # Local preference checks
      # Customer (AS4) must be preferred
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::4/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*200'

      # Peer (AS1) must be medium preference
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::1/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*100'

      # Best path to AS7
      - command: 'vtysh -c "show bgp ipv6 unicast json"'
        regex_match: '"2001:db8:1::7/128".*"bestpath":true.*"nexthops":\[\{"ip":"2001:db8:65d7::2"'
    # =========================
    # AS7
    # =========================
    as7:

      # EXPORT → provider
      - command: 'vtysh -c "show bgp neighbors 2001:db8:650d::1 advertised-routes json"'
        regex_match: '"totalPrefixCounter":\s*1'

      # IMPORT
      - command: 'vtysh -c "show bgp neighbors 2001:db8:650d::1 prefix-counts json"'
        regex_match: '"Valid":\s*4'

      # Local preference checks
      # Provider (AS4) must be lowest preference
      - command: 'vtysh -c "show bgp ipv6 json"'
        regex_match: '"2001:db8:1::4/128":\s*\[\{[^}]*"bestpath":true[^}]*"locPrf":\s*50'
